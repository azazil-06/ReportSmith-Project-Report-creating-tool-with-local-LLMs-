  led_active_low: true
code_file: Content\Proximity_Door_Opener.ino
abstract: The Automatic Door System is a simple microcontroller -based project designed
  to automate the opening and closing of a door based on the presence of a person.
  The main objective of this project is to reduce the need for manual operation and
  provide a convenient, hygienic, and user -friendly method of door control. The system
  uses an IR sensor or ultrasonic sensor to detect a person approaching the door.
  The sensor continuously provides information about the presence of an object or
  person to the microcontroller. When a person is detected within the specified range,
  the microcontroller processes the sensor signal and sends a control signal to a
  servo motor. The servo motor then rotates to open the door automatically. An LCD
  or LED indicator can also be included to display or indicate the current status
  of the door. The system can be implemented using a small -scale model door for demonstration,
  making it simple, cost-effective, and easy to operate. When the person moves away
  from the detection area, the sensor identifies that there is no longer an object
  in front of the door, and the microcontroller instructs the servo motor to return
  to its original position, thereby closing the door automatically. The project demonstrates
  important concepts of microcontroller - based embedded systems, including sensor
  interfacing, digital input processing, motor control, and real -time decision making.
  The system can be further improved by adding features such as a buzzer for alerts,
  password or RFID - based access control, automatic lighting, adjustable detection
  distance, and safety mechanisms to prevent the door from closing when an obstacle
  is present. The proposed Automatic Door System provides a practical example of how
  sensors and microcontrollers can be combined to automate everyday tasks. Due to
  its simple hardware requirements, low cost, easy implementation, and clear working
  demonstration, the project is suitable for academic purposes and can serve as a
  basic model for more advanced automated access-control systems.
tests:
- id: TC_01
  name: Daylight Inactivation Test
  condition: Ambient light high (LDR ADC > 1800)
  expected: Lamp OFF, Status LED PC13 OFF (HIGH), PWM duty 0
  observed: null
- id: TC_02
  name: Hysteresis Dusk/Twilight Stability Test
  condition: Ambient light fluctuating within hysteresis band (1400 to 1800)
  expected: System latches existing state without high-frequency toggling or flickering
  observed: null
- id: TC_03
  name: Night Darkness Activation Test
  condition: Ambient light drops below threshold (LDR ADC < 1400)
  expected: Lamp engaged, Status LED PC13 ON (LOW), PWM duty scaled from 60 to 255
  observed: null
