  - OPTIMAL
  - TOO WET
  led_active_low: true
code_file: Content\Plant_Moisture_Detection.ino
abstract: The Plant Watering Reminder using STM32 and Soil Moisture Sensor is a simple
  embedded system designed to monitor the moisture level of soil and remind the user
  when a plant needs watering. The system uses a soil moisture sensor to detect the
  amount of moisture present in the soil. The sensor output is connected to the ADC
  of an STM32 microcontroller, which reads and processes the moisture level. When
  the soil becomes dry and the moisture level falls below a predefined threshold,
  the STM32 activates a buzzer or LED to provide a watering reminder. When sufficient
  moisture is available, the indicator remains OFF. The project uses an ARM Cortex-M
  based STM32, ADC, GPIO, Embedded C, and basic delay/timer concepts. This system
  helps prevent plants from being under-watered and provides a simple and convenient
  method for monitoring soil moisture. The project is low- cost, easy to implement,
  and demonstrates basic sensor interfacing and microcontroller programming.
tests:
- id: TC_01
  name: Dry Soil Alert Test
  condition: Raw ADC >= 2981 (Moisture < 30%)
  expected: Buzzer ACTIVE (HIGH), Status LED PC13 ON (LOW)
  observed: null
- id: TC_02
  name: Optimal Moisture Inactive Test
  condition: 1757 <= Raw ADC <= 2980 (Moisture 30% to 80%)
  expected: Buzzer INACTIVE (LOW), Status LED PC13 OFF (HIGH)
  observed: null
- id: TC_03
  name: Excess Moisture / Saturated Test
  condition: Raw ADC <= 1756 (Moisture > 80%)
  expected: Buzzer INACTIVE (LOW), Status LED PC13 OFF (HIGH)
  observed: null
