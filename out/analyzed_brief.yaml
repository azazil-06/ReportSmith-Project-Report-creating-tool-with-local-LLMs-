abstract: "The SentiScan project is a text-based machine learning system developed\
  \ to automatically determine the sentiment expressed in online product reviews using\
  \ the Multinomial Naive Bayes algorithm. The primary objective of the project is\
  \ to build a fast, lightweight, and reasonably accurate text classification model\
  \ capable of labelling a review as Positive, Neutral, or Negative, helping sellers\
  \ and buyers quickly understand customer opinion without reading hundreds of reviews\
  \ manually, and demonstrating a practical application of natural language processing\
  \ (NLP) to everyday e-commerce data. A suitable review dataset containing customer\
  \ reviews with associated star ratings is used for model development, with the data\
  \ divided into training and testing sets and cleaned using text preprocessing techniques\
  \ including lowercasing, punctuation and stop-word removal, tokenization, and lemmatization.\
  \ Since machine learning models cannot process raw text directly, each cleaned review\
  \ is converted into a numerical representation using Term Frequency\u2013Inverse\
  \ Document Frequency (TF-IDF) vectorization with unigram and bigram features, so\
  \ that words carrying strong sentiment such as \"excellent\", \"broken\", or \"\
  not worth\" receive higher weights than common filler words. After feature extraction,\
  \ the Naive Bayes classifier estimates the probability of each sentiment class for\
  \ an unseen review using the word likelihoods learned from the training data and\
  \ predicts the class with the highest posterior probability, which is also reported\
  \ as an indicative confidence score. The performance of the model is evaluated using\
  \ accuracy, precision, recall, F1-score, and a confusion matrix, and the effect\
  \ of the smoothing parameter and the n-gram range is studied to understand how negation\
  \ (\"not good\") and mixed opinions affect classification effectiveness. The proposed\
  \ SentiScan system provides a simple and practical approach to opinion mining, with\
  \ potential extensions to applications such as product feedback dashboards, brand\
  \ monitoring, customer-support ticket prioritization, and social media analysis.\
  \ It also offers practical exposure to the complete NLP workflow, including data\
  \ collection, text cleaning, feature extraction, probabilistic classification, and\
  \ performance evaluation, demonstrating how a simple probabilistic learning algorithm\
  \ like Naive Bayes can solve a real-world text-analysis problem in an effective\
  \ and accessible manner. Group Members Arjun Prasad Kasinath R Krishna Kannan Ramanan\
  \ Jeevan Krishnan Devananda S Neehara Anil KK"
