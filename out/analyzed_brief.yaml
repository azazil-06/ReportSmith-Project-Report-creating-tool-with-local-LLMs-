implementation:
  mode: hardware
  board:
    name: STM32 Blue Pill
    mcu_part_number: STM32F103C8T6
    core: ARM Cortex-M3
    clock: 72 MHz
    flash: 64 KB
    sram: 20 KB
    voltage: 3.3V
  framework: arduino_stm32core
  components:
  - name: STM32F103C8T6 Development Board (Blue Pill)
    role: Central Processing Unit
    interface: On-board / 72 MHz ARM Cortex-M3
    notes: 64 KB Flash, 20 KB SRAM, 12-bit ADC, Timer PWM
  - name: HC-SR04 Ultrasonic Distance Sensor Module
    role: Non-Contact Water Level Measurement
    interface: Digital Trigger (PB0) & Echo (PB1)
    notes: Acoustic time-of-flight ranging from 2 cm to 400 cm with 3mm precision
  - name: 16x2 Alphanumeric LCD Display (with I2C PCF8574)
    role: Local Telemetry & Level Display
    interface: I2C Bus (PB6 SCL, PB7 SDA at 0x27)
    notes: Displays real-time distance in cm and system status warnings
  - name: Active Buzzer Alert Module
    role: Audible Overflow Warning
    interface: Digital GPIO (PA1)
    notes: Active high sounder activates when water level reaches overflow threshold
  - name: Red & Green Status Indicator LEDs
    role: Visual Level State Annunciation
    interface: Digital GPIOs (PA2 Red, PA3 Green)
    notes: Red indicates overflow alarm; Green indicates normal safe water level
  - name: LM2596 DC-DC Buck Converter Step-Down Module
    role: Regulated Power Supply
    interface: Input 9V-12V Battery, Regulated 5V DC Output
    notes: High-efficiency step-down switching regulator supplying stable 5V rail
  - name: Onboard Indicator LED (PC13)
    role: Visual Diagnostic Indicator
    interface: GPIO (Active-Low)
    notes: Illuminates automatically during overflow alert states
  - name: ST-Link V2 In-Circuit Programmer
    role: Firmware Flashing & Debugging
    interface: SWD (SWDIO, SWCLK)
    notes: Serial Wire Debug interface for STM32 programming
  pins:
  - pin: PB0
    peripheral: GPIO
    connected_to: HC-SR04 Ultrasonic Trigger Pin
    function: 10us ultrasonic pulse generation trigger
  - pin: PB1
    peripheral: GPIO/Timer
    connected_to: HC-SR04 Ultrasonic Echo Pin
    function: High-speed ultrasonic pulse duration echo measurement
  - pin: PA1
    peripheral: GPIO
    connected_to: Active Buzzer Alert Driver
    function: Audible alarm trigger on critical alert condition
  - pin: PA2
    peripheral: GPIO
    connected_to: Red Alert LED
    function: Visual indicator for critical high water level and overflow
  - pin: PA3
    peripheral: GPIO
    connected_to: Green Status LED
    function: Visual indicator for safe and normal water level
  - pin: PB6
    peripheral: I2C1_SCL
    connected_to: 16x2 LCD I2C SCL
    function: I2C clock line for 16x2 alphanumeric LCD display
  - pin: PB7
    peripheral: I2C1_SDA
    connected_to: 16x2 LCD I2C SDA
    function: I2C data line for 16x2 alphanumeric LCD display
  - pin: PC13
    peripheral: GPIOC
    connected_to: Onboard Status LED
    function: Active-low status alert indicator (lights when action needed)
  - pin: PA9
    peripheral: USART1_TX
    connected_to: USB-to-UART Adapter RX
    function: Serial telemetry and debug monitoring at 115200 baud
  - pin: PA10
    peripheral: USART1_RX
    connected_to: USB-to-UART Adapter TX
    function: Serial receiver interface
  peripherals:
  - GPIO
  - ADC
  - Timers
  - UART
  - I2C
  libraries:
  - Arduino.h
  - Arduino_Core_STM32
  - Wire.h
  - LiquidCrystal_I2C.h
  programmer: ST-Link V2
  serial_baud: 115200
behaviour:
  calibration_constants:
    TANK_HEIGHT_CM: 100
    OVERFLOW_THRESHOLD_CM: 15
  thresholds:
    WARNING_THRESHOLD_CM: 30
    OVERFLOW_THRESHOLD_CM: 15
  timing_values:
    SAMPLE_INTERVAL_MS: 500
    SAMPLES: 5
  state_names:
  - CRITICAL OVERFLOW ALERT
  - APPROACHING HIGH LEVEL
  - NORMAL / SAFE WATER LEVEL
  led_active_low: true
code_file: Content\Water_Level_Overflow_Indicator.ino
abstract: The Water Level Overflow Indicator is designed to monitor the water level
  in a tank and provide a warning when the water approaches a predefined high level.
  The system uses an HC-SR04 ultrasonic sensor to measure the distance between the
  sensor and the water surface. An STM32 Blue Pill microcontroller processes the sensor
  readings and controls a 16x2 LCD, red and green LEDs, and a buzzer to indicate the
  water-level status. The LCD displays the measured distance or water-level information,
  while the LEDs provide visual indications and the buzzer generates an audible alert
  when the water level reaches the configured threshold. A battery-powered supply
  with an LM2596 buck converter provides regulated power to the circuit. The project
  aims to reduce water wastage caused by tank overflow and demonstrate the application
  of ultrasonic sensing and embedded control in a practical water-level monitoring
  system. The system does not automatically stop the water flow; instead, it alerts
  the user so that appropriate action can be taken
tests:
- id: TC_01
  name: High Water Level / Critical Overflow Alert Test
  condition: Measured Distance <= 15 cm (Tank > 85% full)
  expected: Red LED ON, Active Buzzer sounding, Green LED OFF, LCD shows 'OVERFLOW
    ALERT!'
  observed: null
- id: TC_02
  name: Approaching High Level Warning Test
  condition: 16 cm <= Measured Distance <= 30 cm (70% to 85% full)
  expected: Red LED ON, Green LED ON, Buzzer OFF, LCD shows 'LEVEL HIGH'
  observed: null
- id: TC_03
  name: Normal / Safe Water Level Verification Test
  condition: Measured Distance > 30 cm (Tank < 70% full)
  expected: 'Green LED ON, Red LED OFF, Buzzer OFF, LCD shows ''STATUS: NORMAL'''
  observed: null
