  - "Paul Horowitz and Winfield Hill, 'The Art of Electronics', Cambridge University Press, 3rd Edition, 2015."

extra_notes: "Plant Watering Reminder using STM32F103C8T6 with Soil Moisture Sensor on PA0, Buzzer on PA1, and PC13 status LED."
